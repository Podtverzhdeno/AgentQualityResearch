[project]
name = "agent-quality-research"
version = "0.1.0"
description = "Reproducible evaluation of LangGraph agents with Langfuse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.0.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.3.0",
  "langgraph>=0.4.0",
  "langfuse>=3.0.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
aqr = "agent_quality.cli:main"
aqr-sync-dataset = "agent_quality.dataset_sync:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_quality"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
